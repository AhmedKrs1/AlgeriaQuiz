<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Algérie</title>


<style>
:root{--bg:#14182e;--card:#1f2547;--ink:#f5f1e6;--mute:#9aa3c7;--r:#e2453c;--b:#2f6fe0;--y:#f0b429;--g:#17a35f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 "Trebuchet MS",system-ui,sans-serif;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:24px}
h1{font:800 clamp(2rem,6vw,3.6rem)/1 Georgia,serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border-radius:14px;padding:16px 20px;margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card b{flex:1;font-size:1.2rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:#3a4276;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.pri{background:var(--y);color:#1b1500;font-weight:700}
.top{display:flex;justify-content:space-between;color:var(--mute);margin-bottom:8px}
.bar{height:12px;background:#2a3160;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);width:100%}
.q{font:700 clamp(1.5rem,4vw,2.5rem)/1.2 Georgia,serif;margin:18px 0}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.ans button{min-height:110px;font-size:clamp(1.1rem,2.6vw,1.7rem);font-weight:700;text-align:left;display:flex;gap:14px;align-items:center;color:#fff;border-radius:12px}
.a0{background:var(--r)}.a1{background:var(--b)}.a2{background:var(--y);color:#1b1500!important}.a3{background:var(--g)}
.ans button.dim{opacity:.3}
.ans button.ok{outline:5px solid #fff}
#msg{min-height:2.6em;margin:16px 0 8px;font-size:1.3rem}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:2px solid #3a4276;background:#10142a;color:var(--ink)}
.fld{margin:8px 0}
.qb{background:var(--card);border-radius:14px;padding:14px 18px;margin:14px 0}
.row{display:flex;gap:10px;align-items:center;margin:6px 0}
.row input[type=radio]{width:22px;height:22px;accent-color:var(--y)}
.big{font:800 3rem/1 Georgia,serif;color:var(--y)}
ol{padding-left:1.3em}
@media(max-width:600px){.ans{grid-template-columns:1fr}}
</style></head>


<body><main id="app"></main>
<script>


const SH = ['▲','◆','●','■'];
const DEF = [
 {id:'s1', name:'Set 1: The classics (then pain)', qs:[
  {q:'What is the capital of Algeria?', a:['Oran','Algiers','Constantine','Annaba'], c:1},
  {q:'In which year did Algeria win its independence?', a:['1954','1958','1965','1962'], c:3},
  {q:'Timgad, the Roman "Pompeii of Africa", was founded around 100 AD by which emperor?', a:['Hadrian','Augustus','Trajan','Septimius Severus'], c:2},
  {q:'What is the highest peak in Algeria?', a:['Mount Chelia','Mount Tahat','Mount Assekrem','Mount Lalla Khedidja'], c:1},
  {q:'Who wrote the 1956 novel Nedjma?', a:['Mohammed Dib','Kateb Yacine','Assia Djebar','Mouloud Feraoun'], c:1},
  {q:'In which region was the 1956 Soummam Conference, which organised the FLN, held?', a:['Aurès','Hoggar','Kabylie','Oranie'], c:2},
  {q:'The Ahellil, a UNESCO-listed polyphonic chant, comes from which Algerian region?', a:['Mzab','Gourara','Tassili n\'Ajjer','Aurès'], c:1}
 ]},
 {id:'s2', name:'Set 2: Deep cuts', qs:[
  {q:'Which symbols sit in the centre of the Algerian flag?', a:['A red crescent and star','A green cedar','A yellow sun','Crossed swords'], c:0},
  {q:'Which desert covers most of Algeria?', a:['Gobi','Sahara','Kalahari','Namib'], c:1},
  {q:'Emir Abdelkader surrendered to French forces in which year?', a:['1830','1857','1847','1871'], c:2},
  {q:'Which Numidian king was handed over to Rome by Bocchus I in 105 BC?', a:['Syphax','Massinissa','Gauda','Jugurtha'], c:3},
  {q:'The Djamaa el-Djazaïr in Algiers has the tallest minaret in the world. About how tall is it?', a:['265 m','180 m','320 m','210 m'], c:0},
  {q:'Who scored Algeria\'s winning goal against West Germany at the 1982 World Cup?', a:['Rabah Madjer','Salah Assad','Djamel Menad','Lakhdar Belloumi'], c:3},
  {q:'The Royal Mausoleum of Mauretania near Tipaza is traditionally linked to which royal couple?', a:['Syphax and Sophonisba','Juba II and Cleopatra Selene','Micipsa and Hiempsal','Bocchus I and Sulla'], c:1}
 ]},
  {id:'s3', name:'Set 3: War, resistance and betrayal', qs:[
  {q:'Which country colonised Algeria from 1830?', a:['Spain','Italy','France','Britain'], c:2},
  {q:'Who was the first president of independent Algeria?', a:['Houari Boumediene','Ahmed Ben Bella','Abdelaziz Bouteflika','Chadli Bendjedid'], c:1},
  {q:'Which of these was NOT one of the six historic leaders who launched the November 1954 uprising?', a:['Mostefa Ben Boulaïd','Didouche Mourad','Houari Boumediene','Rabah Bitat'], c:2},
  {q:'Mohamed El Mokrani led the 1871 revolt in Kabylie alongside which religious leader?', a:['Cheikh El Haddad','Cheikh Bouamama','Lalla Fatma N\'Soumer','Emir Abdelkader'], c:0},
  {q:'The 1837 Treaty of the Tafna was signed between Emir Abdelkader and which French general?', a:['Desmichels','Bugeaud','Clauzel','Lamoricière'], c:1},
  {q:'Which two towns, besides Sétif, saw the worst of the May 1945 massacres?', a:['Guelma and Kherrata','Oran and Mostaganem','Batna and Biskra','Blida and Médéa'], c:0},
  {q:'What was the name of the electrified fence built by France along the Tunisian border in 1956-57?', a:['Maginot Line','Morice Line','Challe Line','Bugeaud Line'], c:1}
 ]},
 {id:'s4', name:'Set 4: Culture, music and food', qs:[
  {q:'Which dish is considered the national dish of Algeria?', a:['Couscous','Paella','Falafel','Moussaka'], c:0},
  {q:'Which music genre was born in the city of Oran?', a:['Flamenco','Raï','Fado','Rumba'], c:1},
  {q:'Who is known as the father of chaabi music in Algiers?', a:['Dahmane El Harrachi','Cheb Hasni','El Hadj M\'Hamed El Anka','Cheikh El Hasnaoui'], c:2},
  {q:'Rachid Taha\'s 1993 hit "Ya Rayah" was a cover of a song by which singer?', a:['Dahmane El Harrachi','Cheb Hasni','Boudjemaa El Ankis','Blaoui Houari'], c:0},
  {q:'Which Algerian director won the 1975 Palme d\'Or for Chronicle of the Years of Fire?', a:['Merzak Allouache','Mohammed Lakhdar-Hamina','Rachid Bouchareb','Ahmed Rachedi'], c:1},
  {q:'Chakhchoukha is traditionally made with what?', a:['Torn flatbread in a spiced stew','Fried dough in honey','Grilled sardines','Stuffed grape leaves'], c:0},
  {q:'Albert Camus was born in 1913 in a town then called Mondovi. What is it called today?', a:['Skikda','Dréan','Tipaza','Souk Ahras'], c:1}
 ]},
 {id:'s5', name:'Set 5: Land and sport', qs:[
  {q:'Algeria is the largest country by area on which continent?', a:['Asia','Europe','Africa','Oceania'], c:2},
  {q:'Which sea borders Algeria\'s northern coast?', a:['Red Sea','Mediterranean Sea','Black Sea','Caspian Sea'], c:1},
  {q:'What is the Tassili n\'Ajjer plateau mainly famous for?', a:['Prehistoric rock art','Oil fields','Roman mosaics','Date palm groves'], c:0},
  {q:'Charles de Foucauld built his hermitage on which plateau in the Hoggar?', a:['Tamanrasset','Assekrem','Djanet','Timimoun'], c:1},
  {q:'What is the longest river in Algeria?', a:['Soummam','Chelif','Seybouse','Tafna'], c:1},
  {q:'Who won Olympic gold in the men\'s 1500 m at Atlanta 1996?', a:['Hassiba Boulmerka','Noureddine Morceli','Taoufik Makhloufi','Said Aouita'], c:1},
  {q:'Who scored Algeria\'s goal in the 2019 Africa Cup of Nations final against Senegal?', a:['Riyad Mahrez','Baghdad Bounedjah','Islam Slimani','Sofiane Feghouli'], c:1}
 ]}

 
];
const WIN = ['Respect.','Okay, you cheated.','Algerian by blood, historian by soul.','Your grandma is proud.'];
const LOSE = ['That one was meant to hurt.','Even the Sahara is confused.','Ask your grandma.','Nobody knew. Probably.'];
const FREE = ['That was the free one...','Wow. Round of applause for the courage.'];


const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function ld(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function sv(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

let sets = ld('alg.sets', DEF);
let board = ld('alg.board', {});
let g = null;

function home(){
  if (g) clearInterval(g.tm);
  g = null;
  app.innerHTML = '<h1>Quiz Algérie</h1><p class="sub">7 questions per round. How much do you know about Algeria?</p>' +
    sets.map(s => `<div class="card"><b>${esc(s.name)}</b>
      <button class="pri" data-act="ready" data-id="${s.id}">Play</button>
      <button data-act="edit" data-id="${s.id}">Edit</button>
      <button data-act="del" data-id="${s.id}">Delete</button></div>`).join('') +
    '<p><button data-act="new">+ New set</button></p>';
}

function ready(id){
  const s = sets.find(x => x.id === id);
  app.innerHTML = `<h1>${esc(s.name)}</h1><p class="sub">Type your name, then press Start. Keys 1 to 4 pick an answer.</p>
    <div class="fld"><input type="text" id="pn" placeholder="Player name" maxlength="20"></div>
    <p><button class="pri" data-act="start" data-id="${id}">Start</button> <button data-act="home">Back</button></p>`;
  $('#pn').focus();
}


function start(id){
  const s = sets.find(x => x.id === id);
  g = {set:s, i:0, score:0, name:($('#pn').value.trim() || 'Player'), phase:'', tm:null};
  ask();
}

function ask(){
  const q = g.set.qs[g.i];
  g.lim = 60; // Change time
  g.phase = 'q';
  g.t0 = Date.now();
  app.innerHTML = `<div class="top"><span>Question ${g.i+1} of ${g.set.qs.length}</span><span>${esc(g.name)}: ${g.score} pts</span><span id="sec">${g.lim}</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="q">${esc(q.q)}</div>
    <div class="ans">${q.a.map((t,j) => `<button class="a${j}" data-act="pick" data-j="${j}"><span>${SH[j]}</span><span>${esc(t)}</span></button>`).join('')}</div>
    <div id="msg"></div><div id="nx"></div>`;
  g.tm = setInterval(() => {
    const left = Math.max(0, g.lim - (Date.now() - g.t0) / 1000);
    $('#bar').style.width = (left / g.lim * 100) + '%';
    $('#sec').textContent = Math.ceil(left);
    if (left <= 0) reveal(-1);
  }, 100);
}


function reveal(j){
  if (g.phase !== 'q') return;
  clearInterval(g.tm);
  g.phase = 'r';
  const q = g.set.qs[g.i];
  const left = Math.max(0, g.lim - (Date.now() - g.t0) / 1000);
  let msg;
  if (j === q.c){
    const pts = Math.round(500 + 500 * left / g.lim);
    g.score += pts;
    msg = `+${pts}. ` + pick(WIN);
  } else {
    msg = (j === -1 ? "Time's up. " : '') + (g.i < 2 ? pick(FREE) : pick(LOSE));
  }
  document.querySelectorAll('.ans button').forEach((b, k) => {
    b.disabled = true;
    b.classList.add(k === q.c ? 'ok' : 'dim');
  });
  $('#msg').textContent = msg;
  const last = g.i === g.set.qs.length - 1;
  $('#nx').innerHTML = `<button class="pri" data-act="next">${last ? 'Finish' : 'Next question'}</button>`;
}

function next(){
  g.i += 1;
  if (g.i < g.set.qs.length) { ask(); return; }
  const list = board[g.set.id] || [];
  list.push({n:g.name, s:g.score});
  list.sort((a, b) => b.s - a.s);
  board[g.set.id] = list.slice(0, 5);
  sv('alg.board', board);
  app.innerHTML = `<h1>${esc(g.name)}</h1><div class="big">${g.score} pts</div>
    <h2>Top 5</h2><ol>${board[g.set.id].map(e => `<li>${esc(e.n)}: ${e.s}</li>`).join('')}</ol>
    <p><button class="pri" data-act="ready" data-id="${g.set.id}">Next player</button> <button data-act="home">Home</button></p>`;
}


function edit(id){
  const s = id ? sets.find(x => x.id === id)
    : {id:'', name:'', qs:Array.from({length:7}, () => ({q:'', a:['','','',''], c:0}))};
  app.innerHTML = `<h1>${id ? 'Edit set' : 'New set'}</h1>
    <div class="fld"><input type="text" id="nm" placeholder="Set name" value="${esc(s.name)}"></div>
    <p class="sub">Tick the circle next to the right answer.</p>` +
    s.qs.map((q, i) => `<div class="qb"><div class="fld"><input type="text" id="q${i}" placeholder="Question ${i+1}" value="${esc(q.q)}"></div>` +
      q.a.map((t, j) => `<div class="row"><input type="radio" name="c${i}" value="${j}" ${q.c === j ? 'checked' : ''}><input type="text" id="a${i}_${j}" placeholder="${SH[j]} Answer" value="${esc(t)}"></div>`).join('') +
      '</div>').join('') +
    `<p><button class="pri" data-act="save" data-id="${id || ''}">Save set</button> <button data-act="home">Cancel</button></p>`;
}

function saveSet(id){
  const name = $('#nm').value.trim();
  const qs = [];
  for (let i = 0; i < 7; i++){
    const q = $('#q' + i).value.trim();
    const a = [0,1,2,3].map(j => $('#a' + i + '_' + j).value.trim());
    const r = document.querySelector(`input[name="c${i}"]:checked`);
    if (!q || a.some(x => !x)) { alert('Question ' + (i + 1) + ' is incomplete.'); return; }
    qs.push({q:q, a:a, c:Number(r.value)});
  }
  if (!name) { alert('Give the set a name.'); return; }
  if (id) { sets = sets.map(s => s.id === id ? {id:id, name:name, qs:qs} : s); }
  else { sets.push({id:'s' + Date.now(), name:name, qs:qs}); }
  sv('alg.sets', sets);
  home();
}




app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'home') home();
  else if (a === 'ready') ready(id);
  else if (a === 'start') start(id);
  else if (a === 'pick') reveal(Number(b.dataset.j));
  else if (a === 'next') next();
  else if (a === 'edit') edit(id);
  else if (a === 'new') edit(null);
  else if (a === 'save') saveSet(id);
  else if (a === 'del') {
    if (confirm('Delete this set?')) { sets = sets.filter(s => s.id !== id); sv('alg.sets', sets); home(); }
  }
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Enter' && $('#pn') && e.target.id === 'pn') $('[data-act="start"]').click();
    return;
  }
  if (!g) return;
  if (g.phase === 'q' && '1234'.includes(e.key) && e.key.length === 1) reveal(Number(e.key) - 1);
  else if (g.phase === 'r' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
});

home();
</script></body></html>
